<!--
  Estúdio de modelos — ferramenta de desenvolvimento.

  Renderiza o boneco e todas as armas fora da partida, para dar para ajustar
  proporção, cor e animação sem precisar entrar num jogo e correr até o
  inimigo. Não faz parte do jogo: abre com `npm run estudio`.
-->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Estúdio de modelos — Metralhas Strike Block</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' app:; script-src 'self' app:; style-src 'self' app: 'unsafe-inline'; img-src 'self' app: data:;"
    />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <style>
      body { display: flex; flex-direction: column; height: 100vh; }
      .barra {
        display: flex; gap: 8px; padding: 10px; flex-wrap: wrap;
        background: var(--fundo-2); border-bottom: 1px solid var(--borda);
      }
      .barra button { padding: 6px 12px; font-size: 13px; }
      .barra button.ativo { background: var(--azul-escuro); border-color: var(--azul); }
      .palco { flex: 1; position: relative; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .legenda {
        position: absolute; left: 12px; bottom: 12px; font-family: var(--fonte-mono);
        font-size: 12px; color: var(--texto-fraco);
      }
    </style>
  </head>
  <body>
    <div class="barra" id="barra"></div>
    <div class="palco"><canvas id="tela"></canvas></div>
    <div class="legenda" id="legenda"></div>
    <script type="module" src="js/estudio.js"></script>
  </body>
</html>
