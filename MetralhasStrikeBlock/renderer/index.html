<!--
  Casca da interface. Tudo o que aparece na tela é montado por JavaScript dentro
  de #raiz; este arquivo só carrega os estilos e o ponto de entrada.
-->
<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Metralhas Strike Block</title>

    <!--
      Política de segurança de conteúdo: nada de script remoto, nada de eval.
      connect-src precisa liberar ws: e wss: porque é por WebSocket que o jogo
      fala com o servidor de partidas.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' app:; script-src 'self' app:; style-src 'self' app:; font-src 'self' app:; img-src 'self' app: data: https:; connect-src ws: wss:;"
    />

    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/telas.css" />
    <link rel="stylesheet" href="styles/hud.css" />
    <link rel="stylesheet" href="styles/menu-compra.css" />
  </head>
  <body>
    <div id="raiz"></div>
    <div id="avisos" aria-live="polite"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
